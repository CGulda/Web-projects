<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Maze</title>
  <link rel="stylesheet" href="maze-style.css" />
</head>
<body>
  <div id="controls">
    <h1>Circular Maze Engine</h1>
    <label>
      Rings <span class="small" id="ringsValue"></span>
      <input id="rings" type="range" min="3" max="24" value="16" />
    </label>
    <label>
      Algorithm
      <select id="algorithm">
        <option value="backtracker">Recursive Backtracker</option>
        <option value="huntAndKill">Hunt and Kill</option>
        <option value="prim">Prim's Algorithm</option>
      </select>
    </label>
    <label>
      Sectors <span class="small" id="sectorsValue"></span>
      <input id="sectors" type="range" min="6" max="48" value="24" />
    </label>
    <label>
      Doubling steps <span class="small" id="stepsValue"></span>
      <input id="doublingSteps" type="range" min="1" max="8" value="3" />
    </label>
    <label>
      Wall thickness
      <input id="thickness" type="number" min="1" max="20" value="2.5" />
    </label>
    <label>
      Center radius
      <input id="centerRadius" type="number" min="20" max="300" value="120" />
    </label>
    <label>
      Random seed <span class="small" id="seedValue"></span>
      <input id="seed" type="number" min="0" max="9999" value="666" />
    </label>
    <label style="display:flex; align-items:center; gap:8px;">
      <input id="animated" type="checkbox" />
      <span>Animate</span>
    </label>

    <button id="regenerate">Regenerate maze</button>
    <button id="toggleSolution">Hide solution</button>
    <button id="savePNG">Save print PNG</button>
    <p class="small">The center is closed. One outer exit is maintained and the solution line is optional.</p>
    <p class="small" style="font-size:0.75rem; margin-top:auto;">Circular Maze Engine by Ahraman Design</p>
  </div>

  <div id="play-controls">
    <h2>Play</h2>
    <button id="playToggle">PLAY</button>
    <label style="display:flex; align-items:center; gap:6px;">
      <input id="rememberPaths" type="checkbox" checked />
      <span>Remember paths</span>
    </label>
    <label style="display:flex; align-items:center; gap:6px;">
      <input id="showStep" type="checkbox" checked />
      <span>Show step</span>
    </label>
    <label>
      Lookahead (tiles)
      <input id="lookahead" type="number" min="0" max="10" value="2" />
    </label>
  </div>

  <div id="canvas-wrapper"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script src="maze-builder.js"></script>
  <script src="maze-play.js"></script>
  <script src="maze-controls.js"></script>
</body>
</html>
