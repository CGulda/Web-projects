<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Maze</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-width: 320px;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      background: var(--app-bg);
      overflow: hidden;
      transition: grid-template-columns 180ms ease;
    }

    .sidebar {
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100vh;
      gap: 16px;
      padding: 20px 16px;
      border-right: 1px solid var(--border);
      box-shadow: 12px 0 32px rgb(0 0 0 / 12%);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sidebar-content {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      gap: 22px;
    }

    .sidebar-toggle {
      display: grid;
      width: 40px;
      min-height: 40px;
      flex: 0 0 auto;
      align-self: flex-end;
      place-items: center;
      padding: 0;
      color: var(--accent);
      font-size: 1.2rem;
    }

    .settings-collapsed {
      grid-template-columns: 56px minmax(0, 1fr);
    }

    .settings-collapsed .sidebar {
      align-items: center;
      padding: 12px 8px;
    }

    .settings-collapsed .sidebar-content {
      display: none;
    }

    .settings-collapsed .sidebar-toggle {
      align-self: center;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgb(115 229 196 / 35%);
      border-radius: 13px;
      color: var(--accent);
      background: rgb(115 229 196 / 9%);
      font-size: 23px;
    }

    h1 { margin: 14px 0 5px; font-size: 1.55rem; letter-spacing: -0.04em; }
    .intro, .credit, .hint { color: var(--text-muted); font-size: 0.84rem; line-height: 1.55; }
    .intro { margin: 0; }
    .controls { display: grid; gap: 18px; }
    .field { display: grid; gap: 8px; }
    .field label, .field-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #dce8e3;
      font-size: 0.86rem;
      font-weight: 600;
    }
    .value { color: var(--accent); font-variant-numeric: tabular-nums; }
    .resolution-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    [hidden] { display: none !important; }
    .check-row { display: flex; align-items: center; gap: 10px; color: #dce5ed; font-size: 0.9rem; cursor: pointer; }
    input[type="checkbox"] { width: 17px; height: 17px; margin: 0; }
    .status { min-height: 1.4em; margin: 0; color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; }
    .status[data-state="error"] { color: #ff9a9a; }
    .status[data-state="success"] { color: var(--accent); }
    .credit { margin: auto 0 0; padding-top: 20px; border-top: 1px solid var(--border); }
    .button-stack { display: grid; gap: 10px; }

    #canvas-wrapper {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      place-items: start center;
      padding: 24px;
      background-color: #111922;
      background-image: radial-gradient(#344351 0.7px, transparent 0.7px);
      background-size: 22px 22px;
    }

    canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100dvh - 48px);
    }

    @media (max-width: 720px) {
      body {
        height: 100vh;
        height: 100dvh;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 42vh) minmax(0, 1fr);
      }

      .sidebar {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        align-items: start;
        height: 42vh;
        max-height: 42vh;
        gap: 10px;
        padding: 20px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-content { min-height: 0; gap: 16px; }
      .sidebar-toggle { align-self: flex-end; }
      .settings-collapsed {
        grid-template-columns: 56px minmax(0, 1fr);
        grid-template-rows: 1fr;
      }
      .settings-collapsed .sidebar {
        display: flex;
        align-items: center;
        height: 100vh;
        max-height: none;
        padding: 12px 8px;
        border-right: 1px solid var(--border);
        border-bottom: 0;
      }
      .settings-collapsed .sidebar-toggle { align-self: center; }
      .brand-mark { display: none; }
      h1 { margin-top: 0; }
      .intro { margin-bottom: 4px; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .button-stack { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .status { grid-column: 1 / -1; }
      .credit { display: none; }
      #canvas-wrapper { min-height: 0; padding: 16px; }
      .settings-collapsed #canvas-wrapper { height: 100vh; height: 100dvh; }
      body:not(.settings-collapsed) canvas { max-height: calc(58vh - 32px); }
      .settings-collapsed canvas { max-height: calc(100dvh - 32px); }
    }

    @media (max-width: 420px) {
      .controls { grid-template-columns: 1fr; }
      .button-stack { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar app-control-panel" aria-label="Circular maze settings">
    <button class="sidebar-toggle" id="toggleSettings" type="button" aria-label="Hide settings" aria-expanded="true" title="Hide settings">‹</button>
    <div class="sidebar-content">
      <header>
        <div class="brand-mark" aria-hidden="true">⌘</div>
        <h1>Circular Maze</h1>
        <p class="intro">Generate a print-ready polar maze, tune its structure, and reveal a route.</p>
      </header>
      <section class="controls" aria-label="Circular maze settings">
        <div class="field">
          <label for="canvasSize">Canvas size</label>
          <select id="canvasSize">
            <option value="A4">A4 · 300 DPI</option>
            <option value="A5">A5 · 300 DPI</option>
            <option value="FHD">FHD · 1080p</option>
            <option value="4K">4K · UHD</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="resolution-fields" id="customResolutionFields" hidden>
          <div class="field">
            <label for="customWidth">Width · px</label>
            <input id="customWidth" type="number" min="64" max="8192" step="1" value="1920">
          </div>
          <div class="field">
            <label for="customHeight">Height · px</label>
            <input id="customHeight" type="number" min="64" max="8192" step="1" value="1080">
          </div>
        </div>
        <p class="hint" id="canvasDimensions" aria-live="polite"></p>
        <div class="field">
          <label for="rings">Rings <span class="value" id="ringsValue"></span></label>
          <input id="rings" type="range" min="3" max="24" value="16">
        </div>
        <div class="field">
          <label for="algorithm">Algorithm</label>
          <select id="algorithm">
            <option value="backtracker">Recursive Backtracker</option>
            <option value="huntAndKill">Hunt and Kill</option>
            <option value="prim">Prim's Algorithm</option>
          </select>
        </div>
        <div class="field">
          <label for="sectors">Base sectors <span class="value" id="sectorsValue"></span></label>
          <input id="sectors" type="range" min="6" max="48" value="24">
        </div>
        <div class="field">
          <label for="doublingSteps">Sector doubling steps <span class="value" id="stepsValue"></span></label>
          <input id="doublingSteps" type="range" min="1" max="8" value="3">
        </div>
        <div class="field">
          <label for="thickness">Wall thickness</label>
          <input id="thickness" type="number" min="1" max="16" step="1" value="4">
        </div>
        <div class="field">
          <label for="centerRadius">Center radius</label>
          <input id="centerRadius" type="number" min="20" max="300" step="1" value="120">
        </div>
        <div class="field">
          <label for="seed">Seed</label>
          <input id="seed" type="number" min="0" max="999999" step="1" value="666">
        </div>
        <label class="check-row" for="animated">
          <input id="animated" type="checkbox" checked>
          Animate maze creation
        </label>
        <label class="check-row" for="toggleSolution">
          <input id="toggleSolution" type="checkbox">
          Show solution
        </label>
        <div class="button-stack">
          <button class="primary" id="regenerate" type="button">Regenerate maze</button>
          <button id="savePNG" type="button">Save print PNG</button>
        </div>
        <p class="status" id="generationStatus" role="status" aria-live="polite"></p>
        <p class="status" id="resolutionStatus" role="status" aria-live="polite"></p>
      </section>
      <p class="credit"><a href="index.html">← All patterns</a><br>Circular maze · Ahraman Design</p>
    </div>
  </aside>
  <main id="canvas-wrapper" aria-label="Generated circular maze"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script>
    let params = {
      rings: 16,
      algorithm: 'backtracker',
      sectors: 24,
      doublingSteps: 3,
      thickness: 4,
      centerRadius: 120,
      outerPadding: 10,
      seed: 666,
      showSolution: false,
      animated: true,
    };

    const canvasPresets = {
      A4: { width: 2480, height: 3508 },
      A5: { width: 1748, height: 2480 },
      FHD: { width: 1920, height: 1080 },
      '4K': { width: 3840, height: 2160 },
    };
    const maxCanvasPixels = 33554432;
    const canvasSizeInput = document.getElementById('canvasSize');
    const customResolutionFields = document.getElementById('customResolutionFields');
    const customWidthInput = document.getElementById('customWidth');
    const customHeightInput = document.getElementById('customHeight');
    const canvasDimensions = document.getElementById('canvasDimensions');
    const resolutionStatus = document.getElementById('resolutionStatus');

    let cells = [];
    let ringSectorCounts = [];
    let exitCell = null;
    let solutionPath = [];
    let centerEntrySector = 0;
    let generationSteps = 0;

    // Animation state
    let isGenerating = false;
    let generationState = {
      stack: [],
      current: null,
      frontier: [],
      visited: new Set(),
    };

    function setResolutionStatus(message, state = '') {
      resolutionStatus.textContent = message;
      resolutionStatus.dataset.state = state;
    }

    function setGenerationStatus(message, state = '') {
      const status = document.getElementById('generationStatus');
      status.textContent = message;
      status.dataset.state = state;
    }

    function getCanvasDimensions() {
      let outputWidth;
      let outputHeight;
      const presetName = canvasSizeInput.value;
      if (presetName === 'custom') {
        outputWidth = Number(customWidthInput.value);
        outputHeight = Number(customHeightInput.value);
        if (!Number.isInteger(outputWidth) || outputWidth < 64 || outputWidth > 8192 ||
            !Number.isInteger(outputHeight) || outputHeight < 64 || outputHeight > 8192) {
          throw new Error('Custom width and height must be integers from 64 to 8192 px.');
        }
      } else {
        const preset = canvasPresets[presetName];
        if (!preset) throw new Error('Choose a supported canvas size.');
        outputWidth = preset.width;
        outputHeight = preset.height;
      }
      if (outputWidth * outputHeight > maxCanvasPixels) {
        throw new Error('Canvas resolution is too large. Maximum total resolution is 33.5 megapixels.');
      }
      if (Math.min(outputWidth, outputHeight) / 2 - params.outerPadding - params.centerRadius < params.rings - 1) {
        throw new Error('Canvas is too small for the selected rings and center radius. Increase the canvas size or reduce these settings.');
      }
      canvasDimensions.textContent = `${outputWidth.toLocaleString()} × ${outputHeight.toLocaleString()} px`;
      return { width: outputWidth, height: outputHeight, preset: presetName };
    }

    function updateResolutionControls() {
      const isCustom = canvasSizeInput.value === 'custom';
      customResolutionFields.hidden = !isCustom;
    }

    function applyCanvasResolution() {
      try {
        const dimensions = getCanvasDimensions();
        resizeCanvas(dimensions.width, dimensions.height);
        setResolutionStatus('');
        redraw();
      } catch (error) {
        setResolutionStatus(error.message, 'error');
      }
    }

    function setup() {
      const dimensions = getCanvasDimensions();
      pixelDensity(1);
      const canvas = createCanvas(dimensions.width, dimensions.height);
      canvas.parent('canvas-wrapper');
      colorMode(RGB, 255, 255, 255, 1);
      updateControls();
      params.seed = floor(random(10000));
      document.getElementById('seed').value = params.seed;
      generateMaze();
    }

    function windowResized() {
      redraw();
    }

    function draw() {
      background(17, 25, 34);
      translate(width / 2, height / 2);
      strokeWeight(params.thickness);
      noFill();
      drawMaze();
      if (params.showSolution) {
        drawSolution();
      }

      if (isGenerating && params.animated) {
        const stepsPerFrame = max(1, ceil(cells.length / 120));
        for (let step = 0; step < stepsPerFrame && isGenerating; step++) {
          stepGeneration();
          generationSteps++;
        }
        if (isGenerating && generationSteps % max(stepsPerFrame * 8, 1) < stepsPerFrame) {
          const progress = min(99, floor(generationSteps / max(cells.length * 2, 1) * 100));
          setGenerationStatus(`Building maze… ${progress}%`);
        }
      } else if (isGenerating && !params.animated) {
        while (isGenerating) {
          stepGeneration();
          generationSteps++;
        }
      } else {
        noLoop();
      }
    }

    function saveAsPrintPNG() {
      let dimensions;
      try {
        dimensions = getCanvasDimensions();
      } catch (error) {
        setResolutionStatus(error.message, 'error');
        return;
      }
      try {
        while (isGenerating) stepGeneration();
        redraw();
        const g = createGraphics(dimensions.width, dimensions.height);
        g.pixelDensity(1);
        g.colorMode(RGB, 255, 255, 255, 1);
        g.background(255);
        g.translate(dimensions.width / 2, dimensions.height / 2);
        g.strokeWeight(params.thickness);
        g.noFill();
        drawMaze(g, true, dimensions.width, dimensions.height);
        if (params.showSolution) {
          drawSolution(g, true, dimensions.width, dimensions.height);
        }
        const dataURL = g.elt.toDataURL('image/png');
        downloadURI(dataURL, `circular-maze-${dimensions.preset.toLowerCase()}-${dimensions.width}x${dimensions.height}-${params.seed}.png`);
        g.remove();
        setResolutionStatus(`Saved ${dimensions.width.toLocaleString()} × ${dimensions.height.toLocaleString()} px PNG.`, 'success');
      } catch (error) {
        setResolutionStatus(`Could not save PNG: ${error.message}`, 'error');
      }
    }

    function downloadURI(uri, name) {
      const link = document.createElement('a');
      link.href = uri;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function generateMaze() {
      try {
        validateMazeSettings();
        setResolutionStatus('');
        setGenerationStatus(params.animated ? 'Preparing maze…' : 'Building maze…');
      } catch (error) {
        isGenerating = false;
        noLoop();
        setGenerationStatus(error.message, 'error');
        return;
      }
      randomSeed(params.seed);
      noiseSeed(params.seed);
      buildPolarGrid();
      generationSteps = 0;
      isGenerating = true;
      generationState = { stack: [], current: null, frontier: [], visited: new Set() };
      loop();
    }

    function stepGeneration() {
      switch (params.algorithm) {
        case 'huntAndKill':
          stepHuntAndKill();
          break;
        case 'prim':
          stepPrim();
          break;
        default:
          stepBacktracker();
      }
    }

    function stepBacktracker() {
      const { stack, visited } = generationState;

      if (!generationState.current) {
        generationState.current = getCell(1, 0);
        generationState.current.visited = true;
        stack.push(generationState.current);
      }

      if (stack.length === 0) {
        finishGeneration();
        return;
      }

      const current = stack[stack.length - 1];
      const neighbors = findUnvisitedNeighbors(current);

      if (neighbors.length) {
        const next = random(neighbors);
        removeWallBetween(current, next);
        next.visited = true;
        next.parent = current;
        stack.push(next);
      } else {
        stack.pop();
      }
    }

    function stepHuntAndKill() {
      const { stack } = generationState;

      if (!generationState.current) {
        generationState.current = getCell(1, 0);
        generationState.current.visited = true;
        generationState.huntPhase = false;
      }

      if (!generationState.huntPhase) {
        const neighbors = findUnvisitedNeighbors(generationState.current);
        if (neighbors.length) {
          const next = random(neighbors);
          removeWallBetween(generationState.current, next);
          next.visited = true;
          next.parent = generationState.current;
          generationState.current = next;
        } else {
          generationState.huntPhase = true;
          generationState.huntIndex = 0;
        }
      } else {
        let found = false;
        for (let i = generationState.huntIndex; i < cells.length; i++) {
          const cell = cells[i];
          if (cell.ring === 0 || cell.visited) continue;
          const visitedNeighbors = getNeighbors(cell).filter((n) => n.visited);
          if (visitedNeighbors.length) {
            const huntNeighbor = random(visitedNeighbors);
            removeWallBetween(cell, huntNeighbor);
            cell.visited = true;
            cell.parent = huntNeighbor;
            generationState.current = cell;
            generationState.huntPhase = false;
            generationState.huntIndex = 0;
            found = true;
            break;
          }
          generationState.huntIndex = i + 1;
        }
        if (!found) {
          finishGeneration();
        }
      }
    }

    function stepPrim() {
      const { frontier } = generationState;

      if (!generationState.current) {
        generationState.current = getCell(1, 0);
        generationState.current.visited = true;
        const neighbors = getNeighbors(generationState.current);
        neighbors.forEach((n) => {
          if (!n.visited && frontier.indexOf(n) === -1) {
            frontier.push(n);
          }
        });
      }

      if (frontier.length === 0) {
        finishGeneration();
        return;
      }

      const next = random(frontier);
      const visitedNeighbors = getNeighbors(next).filter((cell) => cell.visited);

      if (visitedNeighbors.length) {
        const connect = random(visitedNeighbors);
        removeWallBetween(next, connect);
        next.visited = true;
        next.parent = connect;
        generationState.frontier = frontier.filter((cell) => cell !== next);
        getNeighbors(next).forEach((neighbor) => {
          if (!neighbor.visited && generationState.frontier.indexOf(neighbor) === -1) {
            generationState.frontier.push(neighbor);
          }
        });
      } else {
        generationState.frontier = frontier.filter((cell) => cell !== next);
      }
    }

    function finishGeneration() {
      isGenerating = false;
      chooseExit();
      solutionPath = buildSolutionPath();
      setGenerationStatus('Maze ready.', 'success');
      loop();
    }

    function getNeighbors(cell) {
      const neighbors = [];
      const ring = cell.ring;
      const count = ringSectorCounts[ring];

      if (ring > 1) {
        const innerRing = ring - 1;
        const innerCount = ringSectorCounts[innerRing];
        const start = floor(cell.sector * innerCount / count);
        const end = floor((cell.sector + 1) * innerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          neighbors.push(getCell(innerRing, s));
        }
      }

      if (ring < params.rings - 1) {
        const outerRing = ring + 1;
        const outerCount = ringSectorCounts[outerRing];
        const start = floor(cell.sector * outerCount / count);
        const end = floor((cell.sector + 1) * outerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          neighbors.push(getCell(outerRing, s));
        }
      }

      if (ring > 0) {
        neighbors.push(getCell(ring, cell.sector - 1));
        neighbors.push(getCell(ring, cell.sector + 1));
      }

      return neighbors.filter(Boolean);
    }

    function buildSectorCounts() {
      ringSectorCounts = [];
      const groups = max(1, params.doublingSteps);
      const groupSize = ceil(params.rings / groups);

      for (let ring = 0; ring < params.rings; ring++) {
        if (ring === 0) {
          ringSectorCounts[ring] = 1;
        } else {
          const groupIndex = min(floor(ring / groupSize), groups - 1);
          ringSectorCounts[ring] = params.sectors * Math.pow(2, groupIndex);
        }
      }
    }

    function buildPolarGrid() {
      buildSectorCounts();
      cells = [];
      for (let ring = 0; ring < params.rings; ring++) {
        const count = ringSectorCounts[ring];
        for (let sector = 0; sector < count; sector++) {
          cells.push({
            ring,
            sector,
            visited: false,
            parent: null,
            walls: {
              inner: ring === 0 ? false : true,
              outer: true,
              left: ring === 0 ? false : true,
              right: ring === 0 ? false : true,
            }
          });
        }
      }
    }

    function chooseExit() {
      const outerRing = params.rings - 1;
      const count = ringSectorCounts[outerRing];
      const start = getCell(1, 0);
      let bestDist = -1;
      let bestCandidates = [];

      for (let sector = 0; sector < count; sector++) {
        const cell = getCell(outerRing, sector);
        cell.walls.outer = true;

        let distance = 0;
        let current = cell;
        while (current && current !== start) {
          current = current.parent;
          distance += 1;
        }

        if (current === start) {
          if (distance > bestDist) {
            bestDist = distance;
            bestCandidates = [cell];
          } else if (distance === bestDist) {
            bestCandidates.push(cell);
          }
        }
      }

      const chosen = bestCandidates.length ? random(bestCandidates) : getCell(outerRing, floor(random(count)));
      exitCell = chosen;
      exitCell.walls.outer = false;
    }

    function buildSolutionPath() {
      const path = [];
      let current = exitCell;
      while (current) {
        path.unshift(current);
        current = current.parent;
      }

      const firstRing1 = path.find(cell => cell.ring === 1);
      if (firstRing1) {
        centerEntrySector = firstRing1.sector;
        firstRing1.walls.inner = false;
      }

      return path;
    }

    function getCell(ring, sector) {
      const count = ringSectorCounts[ring];
      const normalized = ((sector % count) + count) % count;
      let index = 0;
      for (let r = 0; r < ring; r++) {
        index += ringSectorCounts[r];
      }
      return cells[index + normalized];
    }

    function findUnvisitedNeighbors(cell) {
      const neighbors = [];
      const ring = cell.ring;
      const count = ringSectorCounts[ring];

      if (ring === 0 && cell.connected) {
        return neighbors;
      }

      // radial inward neighbor(s)
      if (ring > 1) {
        const innerRing = ring - 1;
        const innerCount = ringSectorCounts[innerRing];
        const start = floor(cell.sector * innerCount / count);
        const end = floor((cell.sector + 1) * innerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          const neighbor = getCell(innerRing, s);
          if (!neighbor.visited) neighbors.push(neighbor);
        }
      }

      // radial outward neighbor(s)
      if (ring < params.rings - 1) {
        const outerRing = ring + 1;
        const outerCount = ringSectorCounts[outerRing];
        const start = floor(cell.sector * outerCount / count);
        const end = floor((cell.sector + 1) * outerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          const neighbor = getCell(outerRing, s);
          if (!neighbor.visited) neighbors.push(neighbor);
        }
      }

      // same-ring left / right neighbors
      if (ring > 0) {
        const left = getCell(ring, cell.sector - 1);
        const right = getCell(ring, cell.sector + 1);
        if (left && !left.visited) neighbors.push(left);
        if (right && !right.visited) neighbors.push(right);
      }

      return neighbors;
    }

    function removeWallBetween(a, b) {
      if (b.ring === a.ring - 1) {
        a.walls.inner = false;
        b.walls.outer = false;
        if (b.ring === 0) {
          b.connected = true;
        }
      } else if (b.ring === a.ring + 1) {
        a.walls.outer = false;
        b.walls.inner = false;
        if (a.ring === 0) {
          a.connected = true;
        }
      } else if (b.ring === a.ring) {
        const count = ringSectorCounts[a.ring];
        if (((b.sector + count) % count) === ((a.sector + count - 1) % count)) {
          a.walls.left = false;
          b.walls.right = false;
        } else if (((b.sector + count) % count) === ((a.sector + 1) % count)) {
          a.walls.right = false;
          b.walls.left = false;
        }
      }
    }

    function drawMaze(gfx = window, printMode = false, canvasWidth = width, canvasHeight = height) {
      const centerR = params.centerRadius;
      const radiusStep = (min(canvasWidth, canvasHeight) / 2 - params.outerPadding - centerR) / (params.rings - 1);

      for (const cell of cells) {
        if (cell.ring === 0) continue;

        // During animation, only draw visited cells; after completion, draw all cells
        if (isGenerating && !cell.visited) continue;

        const count = ringSectorCounts[cell.ring];
        const r0 = centerR + (cell.ring - 1) * radiusStep;
        const r1 = centerR + cell.ring * radiusStep;
        const theta0 = cell.sector * TWO_PI / count;
        const theta1 = (cell.sector + 1) * TWO_PI / count;

        if (cell.walls.inner) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(220, 232, 237);
          gfx.arc(0, 0, r0 * 2, r0 * 2, theta0, theta1);
        }
        if (cell.walls.outer) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(220, 232, 237);
          gfx.arc(0, 0, r1 * 2, r1 * 2, theta0, theta1);
        }
        if (cell.walls.left) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(220, 232, 237);
          const x0 = r0 * cos(theta0);
          const y0 = r0 * sin(theta0);
          const x1 = r1 * cos(theta0);
          const y1 = r1 * sin(theta0);
          gfx.line(x0, y0, x1, y1);
        }
        if (cell.walls.right) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(220, 232, 237);
          const x0 = r0 * cos(theta1);
          const y0 = r0 * sin(theta1);
          const x1 = r1 * cos(theta1);
          const y1 = r1 * sin(theta1);
          gfx.line(x0, y0, x1, y1);
        }
      }

      gfx.noFill();
      if (printMode) gfx.stroke(0);
      else gfx.stroke(220, 232, 237);
      gfx.strokeWeight(params.thickness);
      const count = ringSectorCounts[1];
      const theta0 = centerEntrySector * TWO_PI / count;
      const theta1 = (centerEntrySector + 1) * TWO_PI / count;
      gfx.arc(0, 0, centerR * 2, centerR * 2, theta1, theta0 + TWO_PI);
    }

    function drawSolution(gfx = window, printMode = false, canvasWidth = width, canvasHeight = height) {
      if (!solutionPath.length) return;
      const centerR = params.centerRadius;
      const radiusStep = (min(canvasWidth, canvasHeight) / 2 - params.outerPadding - centerR) / (params.rings - 1);

      if (printMode) gfx.stroke(0);
      else gfx.stroke(115, 229, 196);
      gfx.strokeWeight(max(2, params.thickness * 1.4));
      gfx.noFill();
      gfx.beginShape();
      for (const cell of solutionPath) {
        const point = getCellMidpoint(cell, centerR, radiusStep);
        gfx.vertex(point.x, point.y);
      }
      gfx.endShape();
    }

    function getCellMidpoint(cell, centerR, radiusStep) {
      if (cell.ring === 0) {
        return { x: 0, y: 0 };
      }
      const count = ringSectorCounts[cell.ring];
      const r0 = centerR + (cell.ring - 1) * radiusStep;
      const r1 = centerR + cell.ring * radiusStep;
      const rm = (r0 + r1) / 2;
      const theta = (cell.sector + 0.5) * TWO_PI / count;
      return { x: rm * cos(theta), y: rm * sin(theta) };
    }

    function updateControls() {
      document.getElementById('rings').value = params.rings;
      document.getElementById('ringsValue').textContent = params.rings;
      document.getElementById('algorithm').value = params.algorithm;
      document.getElementById('sectors').value = params.sectors;
      document.getElementById('sectorsValue').textContent = params.sectors;
      document.getElementById('doublingSteps').value = params.doublingSteps;
      document.getElementById('stepsValue').textContent = params.doublingSteps;
      document.getElementById('thickness').value = params.thickness;
      document.getElementById('centerRadius').value = params.centerRadius;
      document.getElementById('seed').value = params.seed;
      document.getElementById('toggleSolution').checked = params.showSolution;
    }

    function syncControl(id, prop, cast = Number) {
      const control = document.getElementById(id);
      const eventName = control.type === 'range' ? 'input' : 'change';
      control.addEventListener(eventName, (event) => {
        params[prop] = cast(event.target.value);
        try {
          validateMazeSettings();
          updateControls();
          generateMaze();
        } catch (error) {
          setGenerationStatus(error.message, 'error');
        }
      });
    }

    function validateMazeSettings() {
      if (!Number.isInteger(params.rings) || params.rings < 3 || params.rings > 24) {
        throw new Error('Rings must be from 3 to 24.');
      }
      if (!Number.isInteger(params.sectors) || params.sectors < 6 || params.sectors > 48) {
        throw new Error('Base sectors must be from 6 to 48.');
      }
      if (!Number.isInteger(params.doublingSteps) || params.doublingSteps < 1 || params.doublingSteps > 8) {
        throw new Error('Sector doubling steps must be from 1 to 8.');
      }
      if (!Number.isInteger(params.thickness) || params.thickness < 1 || params.thickness > 16) {
        throw new Error('Wall thickness must be from 1 to 16.');
      }
      if (!Number.isInteger(params.centerRadius) || params.centerRadius < 20 || params.centerRadius > 300) {
        throw new Error('Center radius must be from 20 to 300.');
      }
      if (!Number.isInteger(params.seed) || params.seed < 0 || params.seed > 999999) {
        throw new Error('Seed must be an integer from 0 to 999999.');
      }
      getCanvasDimensions();
    }

    document.getElementById('regenerate').addEventListener('click', () => generateMaze());
    document.getElementById('savePNG').addEventListener('click', () => saveAsPrintPNG());
    canvasSizeInput.addEventListener('change', () => {
      updateResolutionControls();
      applyCanvasResolution();
    });
    [customWidthInput, customHeightInput].forEach((input) => {
      input.addEventListener('change', applyCanvasResolution);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') input.dispatchEvent(new Event('change'));
      });
    });
    document.getElementById('algorithm').addEventListener('change', (event) => {
      params.algorithm = event.target.value;
      try {
        validateMazeSettings();
        updateControls();
        generateMaze();
      } catch (error) {
        setGenerationStatus(error.message, 'error');
      }
    });
    syncControl('rings', 'rings', Number);
    syncControl('sectors', 'sectors', Number);
    syncControl('doublingSteps', 'doublingSteps', Number);
    syncControl('thickness', 'thickness', Number);
    syncControl('centerRadius', 'centerRadius', Number);
    document.getElementById('toggleSolution').addEventListener('change', (event) => {
      params.showSolution = event.target.checked;
      redraw();
    });
    document.getElementById('seed').addEventListener('change', (event) => {
      params.seed = Number(event.target.value);
      try {
        validateMazeSettings();
        updateControls();
        generateMaze();
      } catch (error) {
        setGenerationStatus(error.message, 'error');
      }
    });
    document.getElementById('animated').addEventListener('change', (event) => {
      params.animated = event.target.checked;
      if (!params.animated && isGenerating) redraw();
    });
    document.getElementById('toggleSettings').addEventListener('click', (event) => {
      const collapsed = document.body.classList.toggle('settings-collapsed');
      const expanded = !collapsed;
      event.currentTarget.setAttribute('aria-expanded', String(expanded));
      event.currentTarget.setAttribute('aria-label', expanded ? 'Hide settings' : 'Show settings');
      event.currentTarget.title = expanded ? 'Hide settings' : 'Show settings';
      event.currentTarget.textContent = collapsed ? '›' : '‹';
    });
  </script>
</body>
