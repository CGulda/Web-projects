<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Maze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #f8f8f8;
      font-family: system-ui, sans-serif;
    }
    #controls {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 58px;
      padding: 16px 8px;
      box-sizing: border-box;
      background: rgba(16, 16, 20, 0.92);
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      transition: width 0.24s ease, background 0.24s ease;
      z-index: 10;
    }
    #controls:hover {
      width: 280px;
      background: rgba(16, 16, 20, 0.98);
    }
    #controls::after {
      content: "OPTIONS";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      transform-origin: left top;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.18em;
      font-size: 0.8rem;
      white-space: nowrap;
      pointer-events: none;
    }
    #controls:hover::after {
      opacity: 0;
    }
    #controls > * {
      opacity: 1;
      transition: opacity 0.18s ease;
    }
    #controls:not(:hover) > * {
      opacity: 0;
    }
    #controls h1 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
    }
    #controls label {
      display: grid;
      gap: 6px;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    #controls input[type="range"],
    #controls input[type="number"] {
      width: 100%;
    }
    button {
      border: none;
      padding: 10px 14px;
      cursor: pointer;
      color: #111;
      font-weight: 700;
      background: #fff;
      border-radius: 10px;
      transition: transform 0.15s ease;
    }
    button:hover { transform: scale(1.02); }
    #canvas-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .small { color: #b8b8b8; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="controls">
    <h1>Circular Maze Engine</h1>
    <label>
      Rings <span class="small" id="ringsValue"></span>
      <input id="rings" type="range" min="3" max="24" value="16" />
    </label>
    <label>
      Algorithm
      <select id="algorithm">
        <option value="backtracker">Recursive Backtracker</option>
        <option value="huntAndKill">Hunt and Kill</option>
        <option value="prim">Prim's Algorithm</option>
      </select>
    </label>
    <label>
      Sectors <span class="small" id="sectorsValue"></span>
      <input id="sectors" type="range" min="6" max="48" value="24" />
    </label>
    <label>
      Doubling steps <span class="small" id="stepsValue"></span>
      <input id="doublingSteps" type="range" min="1" max="8" value="3" />
    </label>
    <label>
      Wall thickness
      <input id="thickness" type="number" min="1" max="20" value="10" />
    </label>
    <label>
      Center radius
      <input id="centerRadius" type="number" min="20" max="300" value="120" />
    </label>
    <label>
      Random seed <span class="small" id="seedValue"></span>
      <input id="seed" type="number" min="0" max="9999" value="666" />
    </label>
    <label style="display:flex; align-items:center; gap:8px;">
      <input id="animated" type="checkbox" checked />
      <span>Animate</span>
    </label>
    <button id="regenerate">Regenerate maze</button>
    <button id="toggleSolution">Hide solution</button>
    <button id="savePNG">Save print PNG</button>
    <p class="small">The center is closed. One outer exit is maintained and the solution line is optional.</p>
    <p class="small" style="font-size:0.75rem; margin-top:auto;">Circular Maze Engine by PePe Design</p>
  </div>
  <div id="canvas-wrapper"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script>
    let params = {
      rings: 16,
      algorithm: 'backtracker',
      sectors: 24,
      doublingSteps: 3,
      thickness: 10,
      centerRadius: 120,
      outerPadding: 10,
      seed: 666,
      showSolution: false,
      animated: true,
    };

    let cells = [];
    let ringSectorCounts = [];
    let exitCell = null;
    let solutionPath = [];
    let centerEntrySector = 0;

    // Animation state
    let isGenerating = false;
    let generationState = {
      stack: [],
      current: null,
      frontier: [],
      visited: new Set(),
    };

    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('canvas-wrapper');
      colorMode(HSL, 360, 100, 100, 1);
      updateControls();
      params.seed = floor(random(10000));
      document.getElementById('seed').value = params.seed;
      document.getElementById('seedValue').textContent = params.seed;
      generateMaze();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      redraw();
    }

    function draw() {
      background(11);
      translate(width / 2, height / 2);
      strokeWeight(params.thickness);
      noFill();
      drawMaze();
      if (params.showSolution) {
        drawSolution();
      }

      if (isGenerating && params.animated) {
        stepGeneration();
      } else if (isGenerating && !params.animated) {
        // Run all steps at once if animation is disabled
        while (isGenerating) {
          stepGeneration();
        }
      } else {
        noLoop();
      }
    }

    function saveAsPrintPNG() {
      const g = createGraphics(width, height);
      g.colorMode(HSL, 360, 100, 100, 1);
      g.background(255);
      g.translate(width / 2, height / 2);
      g.strokeWeight(params.thickness);
      g.noFill();
      drawMaze(g, true);
      if (params.showSolution) {
        drawSolution(g, true);
      }
      const dataURL = g.elt.toDataURL('image/png');
      downloadURI(dataURL, 'maze-print.png');
      g.remove();
    }

    function downloadURI(uri, name) {
      const link = document.createElement('a');
      link.href = uri;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function generateMaze() {
      randomSeed(params.seed);
      noiseSeed(params.seed);
      buildPolarGrid();
      isGenerating = true;
      generationState = { stack: [], current: null, frontier: [], visited: new Set() };
      loop();
    }

    function stepGeneration() {
      switch (params.algorithm) {
        case 'huntAndKill':
          stepHuntAndKill();
          break;
        case 'prim':
          stepPrim();
          break;
        default:
          stepBacktracker();
      }
    }

    function stepBacktracker() {
      const { stack, visited } = generationState;

      if (!generationState.current) {
        generationState.current = getCell(1, 0);
        generationState.current.visited = true;
        stack.push(generationState.current);
      }

      if (stack.length === 0) {
        finishGeneration();
        return;
      }

      const current = stack[stack.length - 1];
      const neighbors = findUnvisitedNeighbors(current);

      if (neighbors.length) {
        const next = random(neighbors);
        removeWallBetween(current, next);
        next.visited = true;
        next.parent = current;
        stack.push(next);
      } else {
        stack.pop();
      }
    }

    function stepHuntAndKill() {
      const { stack } = generationState;

      if (!generationState.current) {
        generationState.current = getCell(1, 0);
        generationState.current.visited = true;
        generationState.huntPhase = false;
      }

      if (!generationState.huntPhase) {
        const neighbors = findUnvisitedNeighbors(generationState.current);
        if (neighbors.length) {
          const next = random(neighbors);
          removeWallBetween(generationState.current, next);
          next.visited = true;
          next.parent = generationState.current;
          generationState.current = next;
        } else {
          generationState.huntPhase = true;
          generationState.huntIndex = 0;
        }
      } else {
        let found = false;
        for (let i = generationState.huntIndex; i < cells.length; i++) {
          const cell = cells[i];
          if (cell.ring === 0 || cell.visited) continue;
          const visitedNeighbors = getNeighbors(cell).filter((n) => n.visited);
          if (visitedNeighbors.length) {
            const huntNeighbor = random(visitedNeighbors);
            removeWallBetween(cell, huntNeighbor);
            cell.visited = true;
            cell.parent = huntNeighbor;
            generationState.current = cell;
            generationState.huntPhase = false;
            generationState.huntIndex = 0;
            found = true;
            break;
          }
          generationState.huntIndex = i + 1;
        }
        if (!found) {
          finishGeneration();
        }
      }
    }

    function stepPrim() {
      const { frontier } = generationState;

      if (!generationState.current) {
        generationState.current = getCell(1, 0);
        generationState.current.visited = true;
        const neighbors = getNeighbors(generationState.current);
        neighbors.forEach((n) => {
          if (!n.visited && frontier.indexOf(n) === -1) {
            frontier.push(n);
          }
        });
      }

      if (frontier.length === 0) {
        finishGeneration();
        return;
      }

      const next = random(frontier);
      const visitedNeighbors = getNeighbors(next).filter((cell) => cell.visited);

      if (visitedNeighbors.length) {
        const connect = random(visitedNeighbors);
        removeWallBetween(next, connect);
        next.visited = true;
        next.parent = connect;
        generationState.frontier = frontier.filter((cell) => cell !== next);
        getNeighbors(next).forEach((neighbor) => {
          if (!neighbor.visited && generationState.frontier.indexOf(neighbor) === -1) {
            generationState.frontier.push(neighbor);
          }
        });
      } else {
        generationState.frontier = frontier.filter((cell) => cell !== next);
      }
    }

    function finishGeneration() {
      isGenerating = false;
      chooseExit();
      solutionPath = buildSolutionPath();
      loop();
    }

    function getNeighbors(cell) {
      const neighbors = [];
      const ring = cell.ring;
      const count = ringSectorCounts[ring];

      if (ring > 1) {
        const innerRing = ring - 1;
        const innerCount = ringSectorCounts[innerRing];
        const start = floor(cell.sector * innerCount / count);
        const end = floor((cell.sector + 1) * innerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          neighbors.push(getCell(innerRing, s));
        }
      }

      if (ring < params.rings - 1) {
        const outerRing = ring + 1;
        const outerCount = ringSectorCounts[outerRing];
        const start = floor(cell.sector * outerCount / count);
        const end = floor((cell.sector + 1) * outerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          neighbors.push(getCell(outerRing, s));
        }
      }

      if (ring > 0) {
        neighbors.push(getCell(ring, cell.sector - 1));
        neighbors.push(getCell(ring, cell.sector + 1));
      }

      return neighbors.filter(Boolean);
    }

    function buildSectorCounts() {
      ringSectorCounts = [];
      const groups = max(1, params.doublingSteps);
      const groupSize = ceil(params.rings / groups);

      for (let ring = 0; ring < params.rings; ring++) {
        if (ring === 0) {
          ringSectorCounts[ring] = 1;
        } else {
          const groupIndex = min(floor(ring / groupSize), groups - 1);
          ringSectorCounts[ring] = params.sectors * Math.pow(2, groupIndex);
        }
      }
    }

    function buildPolarGrid() {
      buildSectorCounts();
      cells = [];
      for (let ring = 0; ring < params.rings; ring++) {
        const count = ringSectorCounts[ring];
        for (let sector = 0; sector < count; sector++) {
          cells.push({
            ring,
            sector,
            visited: false,
            parent: null,
            walls: {
              inner: ring === 0 ? false : true,
              outer: true,
              left: ring === 0 ? false : true,
              right: ring === 0 ? false : true,
            }
          });
        }
      }
    }

    function chooseExit() {
      const outerRing = params.rings - 1;
      const count = ringSectorCounts[outerRing];
      const start = getCell(1, 0);
      let bestDist = -1;
      let bestCandidates = [];

      for (let sector = 0; sector < count; sector++) {
        const cell = getCell(outerRing, sector);
        cell.walls.outer = true;

        let distance = 0;
        let current = cell;
        while (current && current !== start) {
          current = current.parent;
          distance += 1;
        }

        if (current === start) {
          if (distance > bestDist) {
            bestDist = distance;
            bestCandidates = [cell];
          } else if (distance === bestDist) {
            bestCandidates.push(cell);
          }
        }
      }

      const chosen = bestCandidates.length ? random(bestCandidates) : getCell(outerRing, floor(random(count)));
      exitCell = chosen;
      exitCell.walls.outer = false;
    }

    function buildSolutionPath() {
      const path = [];
      let current = exitCell;
      while (current) {
        path.unshift(current);
        current = current.parent;
      }

      const firstRing1 = path.find(cell => cell.ring === 1);
      if (firstRing1) {
        centerEntrySector = firstRing1.sector;
        firstRing1.walls.inner = false;
      }

      return path;
    }

    function getCell(ring, sector) {
      const count = ringSectorCounts[ring];
      const normalized = ((sector % count) + count) % count;
      let index = 0;
      for (let r = 0; r < ring; r++) {
        index += ringSectorCounts[r];
      }
      return cells[index + normalized];
    }

    function findUnvisitedNeighbors(cell) {
      const neighbors = [];
      const ring = cell.ring;
      const count = ringSectorCounts[ring];

      if (ring === 0 && cell.connected) {
        return neighbors;
      }

      // radial inward neighbor(s)
      if (ring > 1) {
        const innerRing = ring - 1;
        const innerCount = ringSectorCounts[innerRing];
        const start = floor(cell.sector * innerCount / count);
        const end = floor((cell.sector + 1) * innerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          const neighbor = getCell(innerRing, s);
          if (!neighbor.visited) neighbors.push(neighbor);
        }
      }

      // radial outward neighbor(s)
      if (ring < params.rings - 1) {
        const outerRing = ring + 1;
        const outerCount = ringSectorCounts[outerRing];
        const start = floor(cell.sector * outerCount / count);
        const end = floor((cell.sector + 1) * outerCount / count - 1e-6);
        for (let s = start; s <= end; s++) {
          const neighbor = getCell(outerRing, s);
          if (!neighbor.visited) neighbors.push(neighbor);
        }
      }

      // same-ring left / right neighbors
      if (ring > 0) {
        const left = getCell(ring, cell.sector - 1);
        const right = getCell(ring, cell.sector + 1);
        if (left && !left.visited) neighbors.push(left);
        if (right && !right.visited) neighbors.push(right);
      }

      return neighbors;
    }

    function removeWallBetween(a, b) {
      if (b.ring === a.ring - 1) {
        a.walls.inner = false;
        b.walls.outer = false;
        if (b.ring === 0) {
          b.connected = true;
        }
      } else if (b.ring === a.ring + 1) {
        a.walls.outer = false;
        b.walls.inner = false;
        if (a.ring === 0) {
          a.connected = true;
        }
      } else if (b.ring === a.ring) {
        const count = ringSectorCounts[a.ring];
        if (((b.sector + count) % count) === ((a.sector + count - 1) % count)) {
          a.walls.left = false;
          b.walls.right = false;
        } else if (((b.sector + count) % count) === ((a.sector + 1) % count)) {
          a.walls.right = false;
          b.walls.left = false;
        }
      }
    }

    function drawMaze(gfx = window, printMode = false) {
      const centerR = params.centerRadius;
      const radiusStep = (min(width, height) / 2 - params.outerPadding - centerR) / (params.rings - 1);

      for (const cell of cells) {
        if (cell.ring === 0) continue;

        // During animation, only draw visited cells; after completion, draw all cells
        if (isGenerating && !cell.visited) continue;

        const count = ringSectorCounts[cell.ring];
        const r0 = centerR + (cell.ring - 1) * radiusStep;
        const r1 = centerR + cell.ring * radiusStep;
        const theta0 = cell.sector * TWO_PI / count;
        const theta1 = (cell.sector + 1) * TWO_PI / count;

        if (cell.walls.inner) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(255);
          gfx.arc(0, 0, r0 * 2, r0 * 2, theta0, theta1);
        }
        if (cell.walls.outer) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(255);
          gfx.arc(0, 0, r1 * 2, r1 * 2, theta0, theta1);
        }
        if (cell.walls.left) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(255);
          const x0 = r0 * cos(theta0);
          const y0 = r0 * sin(theta0);
          const x1 = r1 * cos(theta0);
          const y1 = r1 * sin(theta0);
          gfx.line(x0, y0, x1, y1);
        }
        if (cell.walls.right) {
          if (printMode) gfx.stroke(0);
          else gfx.stroke(255);
          const x0 = r0 * cos(theta1);
          const y0 = r0 * sin(theta1);
          const x1 = r1 * cos(theta1);
          const y1 = r1 * sin(theta1);
          gfx.line(x0, y0, x1, y1);
        }
      }

      gfx.noFill();
      if (printMode) gfx.stroke(0);
      else gfx.stroke(255);
      gfx.strokeWeight(params.thickness);
      const count = ringSectorCounts[1];
      const theta0 = centerEntrySector * TWO_PI / count;
      const theta1 = (centerEntrySector + 1) * TWO_PI / count;
      gfx.arc(0, 0, centerR * 2, centerR * 2, theta1, theta0 + TWO_PI);
    }

    function drawSolution(gfx = window, printMode = false) {
      if (!solutionPath.length) return;
      const centerR = params.centerRadius;
      const radiusStep = (min(width, height) / 2 - params.outerPadding - centerR) / (params.rings - 1);

      if (printMode) gfx.stroke(0);
      else gfx.stroke(40, 100, 80);
      gfx.strokeWeight(4);
      gfx.noFill();
      gfx.beginShape();
      for (const cell of solutionPath) {
        const point = getCellMidpoint(cell, centerR, radiusStep);
        gfx.vertex(point.x, point.y);
      }
      gfx.endShape();
    }

    function getCellMidpoint(cell, centerR, radiusStep) {
      if (cell.ring === 0) {
        return { x: 0, y: 0 };
      }
      const count = ringSectorCounts[cell.ring];
      const r0 = centerR + (cell.ring - 1) * radiusStep;
      const r1 = centerR + cell.ring * radiusStep;
      const rm = (r0 + r1) / 2;
      const theta = (cell.sector + 0.5) * TWO_PI / count;
      return { x: rm * cos(theta), y: rm * sin(theta) };
    }

    function updateControls() {
      document.getElementById('rings').value = params.rings;
      document.getElementById('ringsValue').textContent = params.rings;
      document.getElementById('algorithm').value = params.algorithm;
      document.getElementById('sectors').value = params.sectors;
      document.getElementById('sectorsValue').textContent = params.sectors;
      document.getElementById('doublingSteps').value = params.doublingSteps;
      document.getElementById('stepsValue').textContent = params.doublingSteps;
      document.getElementById('thickness').value = params.thickness;
      document.getElementById('centerRadius').value = params.centerRadius;
      document.getElementById('seed').value = params.seed;
      document.getElementById('seedValue').textContent = params.seed;
      document.getElementById('toggleSolution').textContent = params.showSolution ? 'Hide solution' : 'Show solution';
    }

    function syncControl(id, prop, cast = Number) {
      const control = document.getElementById(id);
      control.addEventListener('input', (event) => {
        params[prop] = cast(event.target.value);
        updateControls();
        generateMaze();
      });
    }

    document.getElementById('regenerate').addEventListener('click', () => generateMaze());
    document.getElementById('savePNG').addEventListener('click', () => saveAsPrintPNG());
    document.getElementById('algorithm').addEventListener('change', (event) => {
      params.algorithm = event.target.value;
      updateControls();
      generateMaze();
    });
    syncControl('rings', 'rings', Number);
    syncControl('sectors', 'sectors', Number);
    syncControl('doublingSteps', 'doublingSteps', Number);
    syncControl('thickness', 'thickness', Number);
    syncControl('centerRadius', 'centerRadius', Number);
    document.getElementById('toggleSolution').addEventListener('click', () => {
      params.showSolution = !params.showSolution;
      updateControls();
      redraw();
    });
    document.getElementById('seed').addEventListener('input', (event) => {
      params.seed = Number(event.target.value);
      updateControls();
      generateMaze();
    });
    document.getElementById('animated').addEventListener('change', (event) => {
      params.animated = event.target.checked;
    });
  </script>
</body>
</html>
